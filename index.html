<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WiFi Hacker Demo</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="box">
        <h2>📶 WiFi Hacker</h2>

        <div class="networks">
            <div class="network">
                <span class="network-name">Arshi</span>
                <span class="signal">📶 92%</span>
            </div>
            <div class="network">
                <span class="network-name">Err</span>
                <span class="signal">📶 78%</span>
            </div>
            <div class="network">
                <span class="network-name">ErrorCafe</span>
                <span class="signal">📶 63%</span>
            </div>
        </div>

        <button id="startBtn" onclick="demo()">Start Hack</button>

        <div class="progress">
            <div class="bar" id="bar"></div>
        </div>

        <div id="status">Ready</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
